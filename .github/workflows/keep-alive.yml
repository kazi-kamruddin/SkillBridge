name: Keep Render and Supabase awake

on:
  schedule:
    - cron: '15 8 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wake Render container and verify readiness
        run: |
          set -euo pipefail
          BASE_URL="https://skillbridge-08v4.onrender.com"

          echo "Waking $BASE_URL/health (cold-start tolerant)..."
          curl --fail --location --show-error --silent --output /dev/null \
            --retry 10 --retry-delay 10 --retry-all-errors --max-time 30 \
            "$BASE_URL/health"
          echo "Container is awake."

          for path in ready Explore/Skills Communities; do
            echo "Verifying /$path (pokes Supabase PostgreSQL)..."
            curl --fail --location --show-error --silent --output /dev/null \
              --retry 3 --retry-delay 5 --max-time 30 \
              "$BASE_URL/$path"
          done
          echo "SkillBridge container and Supabase database verified healthy."
